name: Test deploy
run-name: Test deploy (${{ inputs.branch || github.ref_name }})

on:
  push:
    branches: [ test ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: string
      deploy_params:
        description: 'Deploy params'
        default: "-vvv"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test-deploy
  cancel-in-progress: true

jobs:
  deploy-test:

    runs-on: ubuntu-24.04
    environment: test
    defaults:
      run:
        working-directory: ./src

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
    - name: Resolve deployed commit
      id: deployed
      working-directory: .
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Cache Composer
      uses: actions/cache@v4
      with:
        path: |
          ~/.composer/cache
          src/vendor
        key: composer-${{ runner.os }}-php8.5-${{ hashFiles('src/composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-php8.5-
    - name: Install composer dependencies
      run: composer install --optimize-autoloader --no-dev --quiet
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Deploy
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        GITHUB_SHA: ${{ steps.deployed.outputs.sha }}
      run: |
        mkdir -p ~/.ssh
        touch ~/.ssh/deploy
        (echo ${{ secrets.DEPLOY_SSH_KEY }} | base64 --decode -i > ~/.ssh/deploy)
        chmod 700 ~/.ssh/deploy
        php ./vendor/bin/dep deploy test ${{ inputs.deploy_params }}

    - name: Escape commit message (remove < and > only)
      id: escape
      working-directory: .
      run: |
        echo "escaped_message<<EOF" >> "$GITHUB_OUTPUT"
        git log -1 --pretty=%B \
          | sed -e 's/</\[/g' -e 's/>/\]/g' >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Send success status
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: html
        disable_web_page_preview: true
        message: |
          <b>Test deploying ✅</b>
          https://rest.barocco.by
          ${{ inputs.branch || github.ref_name }} @ ${{ steps.deployed.outputs.sha }}

          <blockquote expandable>${{ steps.escape.outputs.escaped_message }}</blockquote>
